[project]
name = "entirius-py-magento2-sdk2"
version = "2.0.0"
description = "Magento 2 REST API client for products, customers, attributes, stores and search, part of Entirius"
keywords = ["magento", "magento2", "rest-api", "sdk", "catalog", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "requests>=2.28.1",
    "marshmallow>=3.19",
    "marshmallow-dataclass>=8.5",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "faker>=8.12.1"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-py-magento2-sdk2"
Changelog = "https://github.com/entirius/entirius-py-magento2-sdk2/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-py-magento2-sdk2/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magento2_sdk2"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy SDK migrated 1:1 — deferred cleanup:
"src/magento2_sdk2/services/request.py" = ["S113", "E721"]     # requests without timeout; type == comparison
"src/magento2_sdk2/validators/response.py" = ["B904"]          # raise without from in except
"tests/**" = ["S101", "S105", "S106", "S311", "F841"]   # asserts; test creds; non-crypto random; unused response

[tool.ruff.lint.isort]
known-first-party = ["magento2_sdk2"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "entirius-py-magento2-sdk2"
version = "2.0.0"
description = "Magento 2 REST API SDK — products, customers, attributes, search and stores"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "requests>=2.28.1",
    "marshmallow>=3.19",
    "marshmallow-dataclass>=8.5",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "faker>=8.12.1"]

[project.urls]
Repository = "https://github.com/entirius/entirius-py-magento2-sdk2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magento2_sdk2"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy SDK migrated 1:1 — deferred cleanup:
"src/magento2_sdk2/services/request.py" = ["S113", "E721"]     # requests without timeout; type == comparison
"src/magento2_sdk2/validators/response.py" = ["B904"]          # raise without from in except
"tests/**" = ["S101", "S105", "S106", "S311", "F841"]   # asserts; test creds; non-crypto random; unused response

[tool.ruff.lint.isort]
known-first-party = ["magento2_sdk2"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
